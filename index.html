const KEY='umong-vod-dashboard-v1';const safeParse=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}};const initial=safeParse();let videos=Array.isArray(initial.videos)?initial.videos:[],slots=Math.max(1,Math.min(10,Number(initial.slots)||5)),tab='queued',pageNo=1,pageSize=50,remaining=60,detailLoading=false;const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify({videos,slots}));const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>v===null||v===undefined?'미입력':Number(v).toLocaleString('ko-KR');const vodId=url=>{const m=String(url).match(/(?:player\/|vod\/|\b)(\d{6,})/);return m?m[1]:null};function validLink(v){try{const u=new URL(v);return u.protocol==='https:'&&(['sooplive.com','www.sooplive.com','vod.sooplive.com','vod.sooplive.co.kr','play.sooplive.co.kr','www.afreecatv.com','vod.afreecatv.com'].includes(u.hostname))}catch{return false}}

 let years=0,days=0;
 if(streamerTier==='best'){
   if(pure===null)return {text:'삭제 예상: 순수조회 확인 중 (기본 2년)',cls:''};
   if(pure>1000)return {text:'영구 보관 기준 충족 (순수조회 1,001회 이상)',cls:'safe'};

}

function pureViews(v){return Number.isFinite(v.views)&&Number.isFinite(v.live)&&v.views>=0&&v.live>=0?Math.max(0,v.views-v.live):null}

function renderPlayers(active){

  const id=encodeURIComponent(String(v.id||''));

  return `<div class="tile"><h3>슬롯 ${i+1} · ${escapeHtml(v.title)}</h3>${playerEnabled?`<iframe src="${embed}" title="${escapeHtml(v.title)}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" loading="eager"></iframe>`:`<div class="empty">플레이어 불러오기 버튼을 눌러주세요.</div>`}<p>${playerEnabled?``:""}<a href="${url}" target="_blank" rel="noopener noreferrer">SOOP 공식 페이지에서 열기 ↗</a></p></div>`;
 }).join('');

function render(){videos.forEach(updateCompletion);const counts={queued:0,done:0,excluded:0};videos.forEach(v=>{if(counts[v.status]!==undefined)counts[v.status]++});Object.keys(counts).forEach(k=>$(k).textContent=counts[k]);$('slots').textContent=slots;const active=videos.filter(v=>v.playSelected&&v.status==='queued'&&v.detailVerified===true).sort((a,b)=>(a.playOrder||0)-(b.playOrder||0)).concat(videos.filter(v=>!v.playSelected&&v.status==='queued'&&v.detailVerified===true&&v.detailVerified===true)).slice(0,slots);renderPlayers(active);const filtered=videos.filter(v=>(v.status===tab)&&(`${v.title} ${v.id||''}`).toLowerCase().includes($('search').value.toLowerCase()));const sort=$('sort').value;if(sort==='low')filtered.sort((a,b)=>(a.views!=null&&a.live!=null?a.views-a.live:Infinity)-(b.views!=null&&b.live!=null?b.views-b.live:Infinity));else if(sort==='views')filtered.sort((a,b)=>(a.views??Infinity)-(b.views??Infinity));else filtered.sort((a,b)=>{const time=v=>{if(!v.created)return Number(v.added)||0;const d=Date.parse(String(v.created).trim().replace(' ','T'));return Number.isFinite(d)?d:(Number(v.added)||0)};return time(b)-time(a)||Number(b.id)-Number(a.id)});$('listtitle').textContent={queued:'대기중',done:'완료',excluded:'제외'}[tab];$('listcount').textContent=filtered.length+'개';$('rows').innerHTML=filtered.length?filtered.slice((pageNo-1)*pageSize,pageNo*pageSize).map(v=>{const pure=pureViews(v);const date=v.created?new Date(String(v.created).replace(' ','T')):null;const dateLabel=date&&!isNaN(date.getTime())?date.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}):'날짜 미확인';const thumb=v.thumbnail&&/^https:\/\//.test(v.thumbnail)?`<img class="vod-thumb" src="${escapeHtml(v.thumbnail)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.outerHTML='<span class=\'vod-thumb vod-placeholder\'>이미지 없음</span>'">`:`<div class="vod-thumb vod-placeholder">이미지 없음</div>`;return `<tr><td class="rownum">${filtered.indexOf(v)+1} async function syncSoop(){
 const notice=$('notice');
 try{
  const r=await fetch('/api/vods',{cache:'no-store'});
  const data=await r.json();
  if(!r.ok)throw Error(data.error||'HTTP '+r.status);
  let added=0;
  for(const item of data.items){
   const id=String(item.id);
   let v=videos.find(x=>String(x.id)===id);
   const count=Number(item.views);
   const liveCount=Number(item.live);
   const validLive=item.live!==null&&item.live!==undefined&&item.live!==''&&Number.isFinite(liveCount)&&liveCount>=0;
   const validCount=item.views!==null&&item.views!==undefined&&item.views!==''&&Number.isFinite(count)&&count>=0;
   if(!v){
    v={key:crypto.randomUUID(),id,url:`https://vod.sooplive.com/player/${id}`,title:item.title,views:validCount?count:null,live:validLive?liveCount:null,status:'queued',added:Date.now(),created:item.created||null,thumbnail:item.thumbnail||null,restriction:item.restriction||null,restrictionReason:item.restrictionReason||'',accessGrade:item.accessGrade??null,detailVerified:item.detailVerified===true};
    updateCompletion(v);videos.push(v);added++;
   }else{
    if(item.restriction){v.restriction=item.restriction;v.restrictionReason=item.restrictionReason||'';}else if(item.accessGrade!==null&&item.accessGrade!==undefined){v.restriction=null;v.restrictionReason='';if(v.exclusionSource==='automatic'){v.status='queued';v.exclusionSource=null;}}if(item.accessGrade!==null&&item.accessGrade!==undefined)v.accessGrade=item.accessGrade;
    v.detailVerified=item.detailVerified===true; if(!v.detailVerified)v.playSelected=false; if(item.title)v.title=item.title;
    if(item.created)v.created=item.created;
    if(item.thumbnail)v.thumbnail=item.thumbnail;
    if(validCount)v.views=count;
    if(validLive)v.live=liveCount;
    updateCompletion(v);
   }
  }
  detailLoading=!!data.detailProgress?.running;
  save();render();
  notice.textContent=`전체 ${data.count}개 · 신규 ${added}개 · 상세 ${data.detailProgress?.checked??0}/${data.detailProgress?.total??data.count}건${data.detailProgress?.running?' 확인중':' 확인완료'} (실패 ${data.detailProgress?.failed??0}건) · ${new Date().toLocaleTimeString('ko-KR')} 갱신`;
 }catch(e){
  notice.textContent='SOOP 목록 연동 실패: '+e.message+' · 서버 실행 여부와 SOOP 접근 상태를 확인하세요. 기존 저장 목록은 유지됩니다.';
 }
}
